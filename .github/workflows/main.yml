name: Build and Deploy Jekyll (dual)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      # ==========================================================
      # Build 1 — GitHub Pages (baseurl padrão)
      # ==========================================================
      - name: Build Jekyll (gh-pages)
        run: |
          bundle exec jekyll build --destination _site_gh_pages

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site_gh_pages

      # ==========================================================
      # Build 2 — rede_ime (baseurl customizado)
      # ==========================================================
      - name: Build Jekyll (rede_ime)
        run: |
          bundle exec jekyll build \
            --baseurl "/~oapotalej" \
            --destination _site_rede_ime

      - name: Deploy to rede_ime
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: rede_ime
          publish_dir: _site_rede_ime
